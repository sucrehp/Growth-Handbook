<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#5544a7">
  <title>我的孩子 · Growth Portfolio</title>
  <style>
    :root{--ink:#25304a;--muted:#778099;--violet:#5848a9;--violet2:#7b68d3;--gold:#e0b84f;--paper:#fffefa;--line:#eae5f2;--soft:#f7f3ff;--danger:#b84d57}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:radial-gradient(circle at 8% 10%,#ffe8b8aa,transparent 32%),radial-gradient(circle at 92% 4%,#d8d0ffbb,transparent 31%),linear-gradient(160deg,#fffaf2,#f6f3ff 58%,#edf7ff)}button,input{font:inherit}.hidden{display:none!important}
    .shell{width:min(1080px,100%);margin:auto;padding:28px clamp(16px,4vw,44px) 60px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:32px}.brand{display:flex;align-items:center;gap:12px}.mark{width:52px;height:52px;display:grid;place-items:center;border-radius:18px;background:linear-gradient(145deg,var(--violet),var(--violet2));color:#fff;font-weight:800;letter-spacing:.12em;box-shadow:0 12px 30px #5848a93d}.brand strong{display:block;font-size:16px}.brand span{display:block;margin-top:3px;color:var(--muted);font-size:11px;letter-spacing:.08em}.ghost{border:1px solid var(--line);border-radius:999px;padding:9px 15px;background:#ffffffaa;color:var(--ink);cursor:pointer}.hero{position:relative;overflow:hidden;padding:clamp(25px,5vw,52px);border:1px solid #ffffffcc;border-radius:34px;background:linear-gradient(135deg,#ffffffd9,#fffaf0c7);box-shadow:0 24px 80px #3f376a17}.hero:after{content:"";position:absolute;width:280px;height:280px;right:-100px;top:-130px;border:1px solid #7b68d32e;border-radius:50%;box-shadow:0 0 0 38px #7b68d30c,0 0 0 76px #e0b84f0b}.eyebrow{position:relative;z-index:1;margin:0 0 8px;color:var(--violet);font-size:11px;font-weight:700;letter-spacing:.2em}.hero h1{position:relative;z-index:1;margin:0;font-family:Georgia,"Noto Serif SC",serif;font-size:clamp(31px,5vw,54px);line-height:1.25}.hero p{position:relative;z-index:1;max-width:610px;margin:14px 0 0;color:var(--muted);line-height:1.8}.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:34px 2px 16px}.section-head h2{margin:0;font-size:22px}.section-head span{color:var(--muted);font-size:12px}.child-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px}.child-card{position:relative;overflow:hidden;min-height:310px;padding:24px;border:1px solid #fff;border-radius:28px;background:var(--paper);box-shadow:0 18px 54px #27345913}.child-card:before{content:"";position:absolute;inset:auto -55px -70px auto;width:190px;height:190px;border-radius:50%;background:linear-gradient(145deg,#fff0b3,#d8ccff);opacity:.55}.child-head{position:relative;display:flex;align-items:center;gap:14px}.avatar{width:66px;height:66px;flex:0 0 auto;display:grid;place-items:center;border-radius:22px;background:linear-gradient(145deg,#f0eaff,#fff3ce);font-size:31px;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.child-head h3{margin:0;font-size:21px}.child-head p{margin:4px 0 0;color:var(--muted);font-size:12px}.facts{position:relative;display:flex;flex-wrap:wrap;gap:7px;margin:20px 0}.pill{padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--muted);font-size:11px}.permission{position:relative;margin:16px 0 22px;padding:13px 14px;border-radius:15px;background:var(--soft);color:#625a77;font-size:12px;line-height:1.7}.open{position:relative;width:100%;border:0;border-radius:16px;padding:14px 18px;background:linear-gradient(135deg,var(--violet),var(--violet2));color:#fff;font-weight:700;cursor:pointer;box-shadow:0 12px 26px #5848a936}.empty{padding:50px 25px;border:1px dashed #cfc5e5;border-radius:28px;background:#ffffff90;text-align:center;color:var(--muted)}
    .gate{min-height:100vh;display:grid;place-items:center;padding:24px}.gate-card{width:min(450px,100%);padding:36px;border:1px solid #fff;border-radius:30px;background:#fffdf8e8;box-shadow:0 28px 90px #2c27511c;backdrop-filter:blur(15px)}.gate-card .mark{margin-bottom:22px}.gate-card h1{margin:0 0 8px;font-size:30px}.gate-card>p{margin:0 0 24px;color:var(--muted);line-height:1.7}.field{display:grid;gap:7px;margin:14px 0;color:#596078;font-size:13px}.field input{width:100%;border:1px solid var(--line);border-radius:13px;padding:12px 14px;background:#fff;color:var(--ink);outline:none}.field input:focus{border-color:var(--violet);box-shadow:0 0 0 3px #5848a912}.primary{width:100%;margin-top:8px;border:0;border-radius:14px;padding:13px 18px;background:var(--violet);color:#fff;font-weight:700;cursor:pointer}.message{margin:13px 0 0;padding:10px 12px;border-radius:10px;background:#fff0f0;color:var(--danger);font-size:12px;line-height:1.6}.help{margin-top:18px!important;text-align:center;font-size:12px}.help a{color:var(--violet)}.setup{margin-bottom:22px;padding:16px;border:1px solid #eadca8;border-radius:16px;background:#fff9e7}.setup strong{display:block;margin-bottom:5px}.setup p{margin:0;color:#7f7045;font-size:12px;line-height:1.7}.loading{min-height:60vh;display:grid;place-items:center;color:var(--muted)}
    @media(max-width:640px){.shell{padding-top:18px}.topbar{margin-bottom:20px}.hero{border-radius:27px}.topbar .brand span{display:none}.child-card{min-height:0}.section-head{align-items:flex-start;flex-direction:column;gap:5px}}
  </style>
</head>
<body>
  <section id="loginView" class="gate">
    <form id="loginForm" class="gate-card">
      <div class="mark">EDU</div>
      <h1>家长登录</h1>
      <p>查看机构为孩子整理的成长档案，以及您被授权使用的家长功能。</p>
      <label class="field">邮箱<input id="email" type="email" autocomplete="email" required></label>
      <label class="field">密码<input id="password" type="password" autocomplete="current-password" required></label>
      <p id="loginMessage" class="message hidden"></p>
      <button class="primary" type="submit">进入我的孩子</button>
      <p class="help">账号由机构邀请开通。如未收到邮件，请联系机构管理员。</p>
    </form>
  </section>

  <section id="passwordView" class="gate hidden">
    <form id="passwordForm" class="gate-card">
      <div class="mark">EDU</div>
      <div class="setup"><strong>家长账号已受邀</strong><p>请先设置登录密码。完成后即可在手机上随时登录。</p></div>
      <label class="field">新密码<input id="newPassword" type="password" minlength="8" autocomplete="new-password" required></label>
      <label class="field">确认密码<input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required></label>
      <p id="passwordMessage" class="message hidden"></p>
      <button class="primary" type="submit">设置密码并进入</button>
    </form>
  </section>

  <div id="loadingView" class="loading hidden">正在打开家庭成长空间…</div>
  <main id="portalView" class="shell hidden">
    <header class="topbar">
      <div class="brand"><div class="mark">EDU</div><div><strong>阿墨逗儿童成长中心</strong><span>FAMILY GROWTH SPACE</span></div></div>
      <button id="logoutButton" class="ghost" type="button">退出登录</button>
    </header>
    <section class="hero"><p class="eyebrow">MY CHILDREN · GROWTH PORTFOLIO</p><h1 id="welcomeTitle">欢迎回家</h1><p>这里汇集孩子被看见、被记录的每一次尝试。每个孩子只显示机构已经为当前家长账号授权的内容。</p></section>
    <div class="section-head"><h2>我的孩子</h2><span id="childCount"></span></div>
    <section id="childGrid" class="child-grid"></section>
  </main>

  <script>
    const state={config:null,token:'',refreshToken:'',inviteMode:false};
    const views=['loginView','passwordView','loadingView','portalView'];
    document.addEventListener('DOMContentLoaded',init);

    async function init(){
      bind();
      const hash=new URLSearchParams(location.hash.slice(1));
      const error=hash.get('error_description');
      if(hash.get('access_token')){
        state.token=hash.get('access_token');
        state.refreshToken=hash.get('refresh_token')||'';
        state.inviteMode=hash.get('type')==='invite' || hash.get('type')==='signup';
        saveSession();
        history.replaceState(null,'',location.pathname);
      }else{
        state.token=localStorage.getItem('edu_access_token')||'';
        state.refreshToken=localStorage.getItem('edu_refresh_token')||'';
      }
      try{
        const response=await fetch('/api/config');state.config=await response.json();
        if(!response.ok||!state.config.configured)throw new Error('登录服务尚未配置');
      }catch(configError){return showLogin(configError.message)}
      if(error)return showLogin(decodeURIComponent(error.replace(/\+/g,' ')));
      if(state.inviteMode&&state.token)return show('passwordView');
      if(state.token)return loadPortal();
      show('loginView');
    }

    function bind(){
      document.getElementById('loginForm').addEventListener('submit',login);
      document.getElementById('passwordForm').addEventListener('submit',setPassword);
      document.getElementById('logoutButton').addEventListener('click',logout);
    }
    function show(id){views.forEach(name=>document.getElementById(name).classList.toggle('hidden',name!==id))}
    function showMessage(id,text){const el=document.getElementById(id);el.textContent=text;el.classList.toggle('hidden',!text)}
    function showLogin(message=''){show('loginView');showMessage('loginMessage',message)}
    function saveSession(){localStorage.setItem('edu_access_token',state.token);localStorage.setItem('edu_refresh_token',state.refreshToken)}
    function clearSession(){state.token='';state.refreshToken='';localStorage.removeItem('edu_access_token');localStorage.removeItem('edu_refresh_token');sessionStorage.removeItem('growthbook_agent_token')}

    async function login(event){
      event.preventDefault();showMessage('loginMessage','');
      const response=await fetch(`${state.config.supabaseUrl}/auth/v1/token?grant_type=password`,{method:'POST',headers:{apikey:state.config.publishableKey,'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value})});
      const payload=await response.json().catch(()=>({}));
      if(!response.ok)return showMessage('loginMessage','邮箱或密码不正确，或账号尚未由机构开通。');
      state.token=payload.access_token;state.refreshToken=payload.refresh_token||'';saveSession();await loadPortal();
    }

    async function setPassword(event){
      event.preventDefault();showMessage('passwordMessage','');
      const password=document.getElementById('newPassword').value;
      if(password!==document.getElementById('confirmPassword').value)return showMessage('passwordMessage','两次输入的密码不一致');
      const response=await fetch(`${state.config.supabaseUrl}/auth/v1/user`,{method:'PUT',headers:{apikey:state.config.publishableKey,Authorization:`Bearer ${state.token}`,'Content-Type':'application/json'},body:JSON.stringify({password})});
      const payload=await response.json().catch(()=>({}));
      if(!response.ok)return showMessage('passwordMessage',payload.msg||payload.message||'密码设置失败，请重新打开最新邀请邮件');
      state.inviteMode=false;await loadPortal();
    }

    async function refreshSession(){
      if(!state.refreshToken)return false;
      const response=await fetch(`${state.config.supabaseUrl}/auth/v1/token?grant_type=refresh_token`,{method:'POST',headers:{apikey:state.config.publishableKey,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:state.refreshToken})});
      const payload=await response.json().catch(()=>({}));if(!response.ok)return false;
      state.token=payload.access_token;state.refreshToken=payload.refresh_token||state.refreshToken;saveSession();return true;
    }
    async function portalApi(retried=false){
      const response=await fetch('/api/parent-portal',{headers:{Authorization:`Bearer ${state.token}`}});
      if(response.status===401&&!retried&&await refreshSession())return portalApi(true);
      const payload=await response.json().catch(()=>({}));if(!response.ok)throw new Error(payload.error||'无法加载家长空间');return payload;
    }
    async function loadPortal(){
      show('loadingView');
      try{const data=await portalApi();renderPortal(data);show('portalView')}
      catch(error){clearSession();showLogin(error.message)}
    }
    function renderPortal(data){
      document.getElementById('welcomeTitle').textContent=`${data.parent?.displayName||'家长'}，欢迎回家`;
      document.getElementById('childCount').textContent=`已授权 ${data.children?.length||0} 位孩子`;
      document.getElementById('childGrid').innerHTML=(data.children||[]).length?data.children.map(childCard).join(''):'<div class="empty">当前没有可查看的孩子，请联系机构管理员确认绑定状态。</div>';
    }
    function childCard(child){
      const avatar=child.avatarUrl?`<img src="${escapeHtml(photoUrl(child.avatarUrl))}" alt="">`:(child.gender==='female'?'👧':'👦');
      const permissions=[child.permissions?.uploadGrowth?'可补充成长素材':'仅查看',child.permissions?.replyComments?'可回复评语':'评语只读'];
      return `<article class="child-card"><div class="child-head"><div class="avatar">${avatar}</div><div><h3>${escapeHtml(child.name)}</h3><p>${escapeHtml(child.relation||'家长')}${child.isPrimary?' · 主要监护人':''}</p></div></div><div class="facts">${child.className?`<span class="pill">${escapeHtml(child.className)}</span>`:''}${child.birthday?`<span class="pill">生日 ${escapeHtml(child.birthday)}</span>`:''}</div><div class="permission">${permissions.map(escapeHtml).join(' · ')}<br>姓名、生日、班级等机构档案由老师维护。</div><button class="open" type="button" onclick="location.href='${escapeHtml(child.portfolioUrl)}'">打开成长档案 →</button></article>`;
    }
    function photoUrl(value){if(!value)return'';if(/^https?:/i.test(value))return value;return `${state.config.supabaseUrl}/storage/v1/object/public/photos/${String(value).split('/').map(encodeURIComponent).join('/')}`}
    function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
    async function logout(){try{await fetch(`${state.config.supabaseUrl}/auth/v1/logout`,{method:'POST',headers:{apikey:state.config.publishableKey,Authorization:`Bearer ${state.token}`}})}catch{}clearSession();showLogin()}
  </script>
</body>
</html>
