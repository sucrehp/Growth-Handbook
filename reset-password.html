<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>设置新密码 · EDU 运营智能体</title>
  <link rel="stylesheet" href="/reset-password.css">
</head>
<body>
  <main class="shell">
    <section class="card">
      <div class="brand">EDU</div>
      <p class="eyebrow">阿墨逗儿童成长中心</p>
      <h1>设置新密码</h1>
      <p id="hint" class="hint">请输入新的管理员登录密码。</p>

      <form id="resetForm">
        <label>
          新密码
          <input id="password" type="password" minlength="8" autocomplete="new-password" required>
        </label>
        <label>
          再次输入
          <input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required>
        </label>
        <button type="submit">确认修改密码</button>
      </form>

      <div id="result" class="result" hidden></div>
      <a class="back" href="/edu">返回 EDU 运营智能体</a>
    </section>
  </main>
  <script src="/reset-password.js"></script>
</body>
</html>
