<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>成长手册 - 阿墨逗儿童成长中心</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
  <style>
    :root {
      --primary: #2C3E6B;
      --primary-light: #4A5C8A;
      --accent: #D4A853;
      --accent-light: #F0D890;
      --bg: #FAF8F5;
      --bg-card: #FFFFFF;
      --text: #2D2D3A;
      --text-mid: #666680;
      --text-light: #9999AA;
      --border: #E8E4DC;
      --shadow: 0 2px 16px rgba(44,62,107,0.06);
      --radius: 16px;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Noto Sans SC',system-ui,sans-serif; background:var(--bg); color:var(--text); line-height:1.7; }
    
    /* ===== Growth Portfolio theme presets ===== */
    body.theme-sky { --primary:#315F91; --primary-light:#74B7E8; --accent:#F1B84B; --accent-light:#FFE3A1; --bg:#F1F8FC; --ink-deep:#153A64; --glow-a:#8ED9F7; --glow-b:#FFE28C; --art-soft:#E4F4FC; --badge-radius:18px 999px 999px 18px; --motif-1:"☁"; --motif-2:"✈"; --motif-3:"风 · 光"; --motif-4:"⌁"; }
    body.theme-cosmic { --primary:#493A8E; --primary-light:#7769D8; --accent:#FFCA57; --accent-light:#FFE8A5; --bg:#F4F1FC; --ink-deep:#1D174D; --glow-a:#A89CFF; --glow-b:#FF85C8; --art-soft:#ECE8FF; --badge-radius:999px; --motif-1:"✦"; --motif-2:"◌"; --motif-3:"⋆｡°✩"; --motif-4:"☾"; }
    body.theme-forest { --primary:#2E6650; --primary-light:#6EAD76; --accent:#D9A94E; --accent-light:#EBD69E; --bg:#F1F7F0; --ink-deep:#173D32; --glow-a:#8CD3A3; --glow-b:#EBC36D; --art-soft:#E4F2E4; --badge-radius:12px 24px 24px 12px; --motif-1:"⌁"; --motif-2:"❧"; --motif-3:"葉 · 光"; --motif-4:"♧"; }
    body.theme-sunshine { --primary:#C45B34; --primary-light:#F09A4A; --accent:#FFD052; --accent-light:#FFE9A5; --bg:#FFF8ED; --ink-deep:#71331F; --glow-a:#FFB75E; --glow-b:#FFE26B; --art-soft:#FFF0D5; --badge-radius:22px 10px 22px 10px; --motif-1:"☀"; --motif-2:"➜"; --motif-3:"GO · PLAY"; --motif-4:"◒"; }
    body.theme-blossom { --primary:#A64F76; --primary-light:#DB86A8; --accent:#E9B75F; --accent-light:#F6DBA7; --bg:#FFF5F7; --ink-deep:#61334F; --glow-a:#F3A9C2; --glow-b:#E6B9F2; --art-soft:#FBE8EF; --badge-radius:18px 999px 999px 18px; --motif-1:"✿"; --motif-2:"❀"; --motif-3:"花 · 光"; --motif-4:"❁"; }
    body.theme-dream { --primary:#5367A4; --primary-light:#9A8BD4; --accent:#E8B9CF; --accent-light:#F4D9E6; --bg:#F7F4FC; --ink-deep:#30365F; --glow-a:#AFC8FF; --glow-b:#EAB9E9; --art-soft:#EEEBFA; --badge-radius:24px 8px 24px 8px; --motif-1:"◒"; --motif-2:"✦"; --motif-3:"梦 · 想"; --motif-4:"〰"; }
    /* Legacy preferences remain readable without creating a second markup system. */
    body.theme-boy_space { --primary:#493A8E; --primary-light:#7769D8; --accent:#FFCA57; --accent-light:#FFE8A5; --bg:#F4F1FC; --ink-deep:#1D174D; --glow-a:#A89CFF; --glow-b:#FF85C8; --art-soft:#ECE8FF; }
    body.theme-boy_forest { --primary:#2E6650; --primary-light:#6EAD76; --accent:#D9A94E; --accent-light:#EBD69E; --bg:#F1F7F0; --ink-deep:#173D32; --glow-a:#8CD3A3; --glow-b:#EBC36D; --art-soft:#E4F2E4; }
    body.theme-girl_garden { --primary:#A64F76; --primary-light:#DB86A8; --accent:#E9B75F; --accent-light:#F6DBA7; --bg:#FFF5F7; --ink-deep:#61334F; --glow-a:#F3A9C2; --glow-b:#E6B9F2; --art-soft:#FBE8EF; }
    body.theme-girl_rainbow { --primary:#5367A4; --primary-light:#9A8BD4; --accent:#E8B9CF; --accent-light:#F4D9E6; --bg:#F7F4FC; --ink-deep:#30365F; --glow-a:#AFC8FF; --glow-b:#EAB9E9; --art-soft:#EEEBFA; }

    /* ===== Loading & Error ===== */
    .center-wrap { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
    .spinner { width:40px; height:40px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .error-card { background:#fff; border-radius:16px; padding:40px; text-align:center; max-width:400px; box-shadow:var(--shadow); }
    .error-card .icon { font-size:48px; margin-bottom:16px; }
    .error-card h2 { font-size:20px; margin-bottom:8px; }
    .error-card p { color:var(--text-mid); font-size:14px; }

    /* ===== Hero Section ===== */
    .hero { background:linear-gradient(135deg, var(--primary), var(--primary-light)); color:#fff; padding:60px 24px 48px; text-align:center; position:relative; overflow:hidden; }
    .hero::before { content:''; position:absolute; top:-50%; right:-20%; width:400px; height:400px; background:rgba(255,255,255,0.05); border-radius:50%; }
    .hero::after { content:''; position:absolute; bottom:-30%; left:-10%; width:300px; height:300px; background:rgba(255,255,255,0.03); border-radius:50%; }
    .hero-content { position:relative; z-index:1; max-width:600px; margin:0 auto; }
    .hero .avatar { width:100px; height:100px; border-radius:50%; margin:0 auto 20px; overflow:hidden; border:3px solid rgba(255,255,255,0.3); background:rgba(255,255,255,0.1); display:flex; align-items:center; justify-content:center; font-size:40px; }
    .hero .avatar img { width:100%; height:100%; object-fit:cover; }
    .hero h1 { font-family:'Noto Serif SC',serif; font-size:32px; font-weight:700; margin-bottom:8px; }
    .hero .subtitle { font-size:15px; opacity:0.85; }
    .hero .meta { display:flex; gap:16px; justify-content:center; margin-top:16px; font-size:13px; opacity:0.75; }
    .hero .gold-line { width:60px; height:3px; background:var(--accent); margin:16px auto 0; border-radius:2px; }

    /* ===== Navigation ===== */
    .nav-bar { background:#fff; border-bottom:1px solid var(--border); position:sticky; top:0; z-index:100; overflow-x:auto; -webkit-overflow-scrolling:touch; }
    .nav-inner { display:flex; max-width:800px; margin:0 auto; padding:0 16px; }
    .nav-item { padding:14px 16px; font-size:13px; font-weight:500; color:var(--text-mid); cursor:pointer; white-space:nowrap; border-bottom:2px solid transparent; transition:all .2s; }
    .nav-item:hover { color:var(--primary); }
    .nav-item.active { color:var(--primary); border-bottom-color:var(--accent); }

    /* ===== Content ===== */
    .content { max-width:800px; margin:0 auto; padding:24px 16px 80px; }
    .section { margin-bottom:32px; scroll-margin-top:70px; }
    .section-title { font-family:'Noto Serif SC',serif; font-size:22px; font-weight:600; color:var(--primary); margin-bottom:4px; display:flex; align-items:center; gap:8px; }
    .section-title .icon { font-size:20px; }
    .section-sub { font-size:13px; color:var(--text-light); margin-bottom:16px; }
    .section-line { width:40px; height:3px; background:var(--accent); border-radius:2px; margin-bottom:20px; }

    /* ===== Cards ===== */
    .card { background:#fff; border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); margin-bottom:12px; }
    .card-title { font-size:16px; font-weight:600; margin-bottom:6px; }
    .card-meta { font-size:12px; color:var(--text-light); margin-bottom:8px; display:flex; gap:12px; }
    .card-body { font-size:14px; color:var(--text-mid); line-height:1.8; }
    .card-body p { margin-bottom:8px; }

    /* ===== Info Card ===== */
    .info-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:12px; }
    .info-item { background:#fff; border-radius:12px; padding:16px; box-shadow:var(--shadow); }
    .info-label { font-size:12px; color:var(--text-light); margin-bottom:4px; }
    .info-value { font-size:15px; font-weight:500; }

    /* ===== Timeline ===== */
    .timeline { position:relative; padding-left:24px; }
    .timeline::before { content:''; position:absolute; left:8px; top:8px; bottom:8px; width:2px; background:var(--border); }
    .timeline-item { position:relative; margin-bottom:20px; }
    .timeline-item::before { content:''; position:absolute; left:-20px; top:8px; width:10px; height:10px; border-radius:50%; background:var(--accent); border:2px solid #fff; box-shadow:0 0 0 2px var(--accent); }
    .timeline-date { font-size:12px; color:var(--accent); font-weight:500; margin-bottom:4px; }
    .timeline-title { font-size:15px; font-weight:600; margin-bottom:4px; }
    .timeline-desc { font-size:14px; color:var(--text-mid); }

    /* ===== Photo Gallery ===== */
    .gallery-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; }
    .gallery-item { aspect-ratio:1; border-radius:12px; overflow:hidden; cursor:pointer; position:relative; }
    .gallery-item img { width:100%; height:100%; object-fit:cover; transition:transform .3s; }
    .gallery-item:hover img { transform:scale(1.05); }
    .gallery-item .caption { position:absolute; bottom:0; left:0; right:0; padding:8px; background:linear-gradient(transparent, rgba(0,0,0,0.6)); color:#fff; font-size:12px; }

    /* ===== Achievement ===== */
    .achievement-card { background:linear-gradient(135deg, var(--accent-light), #fff); border:1px solid var(--accent); }
    .achievement-card .card-title { color:var(--primary); }

    /* ===== Message ===== */
    .message-card { background:var(--bg); border-left:3px solid var(--accent); }
    .message-card .card-body { font-style:italic; }
    .message-sender { font-size:13px; color:var(--text-mid); font-style:normal; margin-top:8px; font-weight:500; }

    /* ===== Empty State ===== */
    .empty { text-align:center; padding:24px; color:var(--text-light); font-size:14px; }

    /* ===== Download Button ===== */
    .fab { position:fixed; bottom:24px; right:24px; z-index:200; }
    .fab button { background:var(--primary); color:#fff; border:none; padding:14px 24px; border-radius:50px; font-size:14px; font-weight:500; font-family:inherit; cursor:pointer; box-shadow:0 4px 16px rgba(44,62,107,0.3); transition:all .2s; display:flex; align-items:center; gap:8px; }
    .fab button:hover { transform:translateY(-2px); box-shadow:0 6px 24px rgba(44,62,107,0.4); }
    .fab button:disabled { opacity:0.6; cursor:not-allowed; transform:none; }
    .fab .download-progress { position:absolute; bottom:100%; right:0; margin-bottom:8px; background:#fff; padding:12px 16px; border-radius:10px; box-shadow:var(--shadow); font-size:13px; white-space:nowrap; display:none; }
    .fab .download-progress.show { display:block; }

    /* ===== Footer ===== */
    .page-footer { text-align:center; padding:32px 16px; color:var(--text-light); font-size:12px; border-top:1px solid var(--border); margin-top:40px; }
    .page-footer .brand { font-weight:600; color:var(--primary); font-size:14px; margin-bottom:4px; }

    /* ===== Lightbox ===== */
    .lightbox { position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:1000; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity .3s; cursor:pointer; }
    .lightbox.show { opacity:1; pointer-events:auto; }
    .lightbox img { max-width:90vw; max-height:90vh; border-radius:8px; }

    /* ===== Responsive ===== */
    @media (max-width:768px) {
      .hero h1 { font-size:26px; }
      .hero .avatar { width:80px; height:80px; font-size:32px; }
      .info-grid { grid-template-columns:1fr 1fr; }
      .gallery-grid { grid-template-columns:repeat(3, 1fr); }
      .nav-item { padding:12px 12px; font-size:12px; }
      .fab button { padding:12px 18px; font-size:13px; }
    }

    /* ===== Animations ===== */
    .fade-in { opacity:0; transform:translateY(20px); transition:all .5s ease-out; }
    .fade-in.visible { opacity:1; transform:translateY(0); }

    /* ===== Dynamic digital-card experience ===== */
    html { scroll-behavior:smooth; }
    body { overflow-x:hidden; background:
      radial-gradient(circle at 8% 8%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 32%),
      radial-gradient(circle at 92% 26%, color-mix(in srgb, var(--primary-light) 12%, transparent), transparent 28%),
      var(--bg);
    }
    .scroll-progress { position:fixed; inset:0 auto auto 0; height:3px; width:0; z-index:1200;
      background:linear-gradient(90deg,var(--accent),var(--primary-light)); box-shadow:0 0 14px var(--accent); }
    .hero { min-height:680px; padding:70px 24px 80px; display:grid; place-items:center;
      background:
        radial-gradient(circle at 50% 10%, rgba(255,255,255,.16), transparent 34%),
        linear-gradient(145deg, color-mix(in srgb, var(--primary) 94%, #111), var(--primary-light));
    }
    .hero::before { width:620px; height:620px; top:-34%; right:-18%; border:1px solid rgba(255,255,255,.13);
      background:transparent; animation:orbit 22s linear infinite; }
    .hero::after { width:380px; height:380px; bottom:-24%; left:-8%; filter:blur(3px);
      background:radial-gradient(circle,rgba(255,255,255,.12),transparent 68%); animation:float 9s ease-in-out infinite; }
    .hero-content { width:min(920px,100%); max-width:none; }
    .digital-card { position:relative; display:grid; grid-template-columns:240px 1fr; gap:42px; align-items:center;
      padding:38px; border:1px solid rgba(255,255,255,.25); border-radius:32px;
      background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,.08));
      box-shadow:0 30px 90px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.28);
      backdrop-filter:blur(20px); text-align:left; overflow:hidden; transform-style:preserve-3d;
      animation:cardEntrance .9s cubic-bezier(.2,.8,.2,1) both; }
    .digital-card::after { content:""; position:absolute; width:220px; height:560px; top:-170px; left:-260px;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent); transform:rotate(22deg);
      animation:shine 7s ease-in-out infinite 1.4s; }
    .portrait-wrap { position:relative; display:grid; place-items:center; }
    .portrait-ring { position:absolute; width:210px; height:210px; border-radius:50%;
      border:1px dashed rgba(255,255,255,.5); animation:orbit 16s linear infinite; }
    .portrait-ring::before,.portrait-ring::after { content:""; position:absolute; width:10px; height:10px;
      border-radius:50%; background:var(--accent); box-shadow:0 0 18px var(--accent); }
    .portrait-ring::before { top:10px; left:38px; }.portrait-ring::after { right:7px; bottom:50px; }
    .hero .avatar { width:172px; height:172px; margin:0; font-size:64px; border:5px solid rgba(255,255,255,.5);
      box-shadow:0 18px 50px rgba(0,0,0,.25); background:rgba(255,255,255,.16); }
    .card-kicker { display:inline-flex; align-items:center; gap:8px; padding:6px 12px; border-radius:99px;
      background:rgba(255,255,255,.13); border:1px solid rgba(255,255,255,.16); font-size:12px; letter-spacing:.13em; }
    .card-kicker i { width:7px; height:7px; border-radius:50%; background:var(--accent); box-shadow:0 0 10px var(--accent); }
    .hero h1 { font-size:clamp(36px,5vw,62px); line-height:1.16; margin:18px 0 10px; letter-spacing:.03em; }
    .hero .subtitle { font-size:16px; letter-spacing:.16em; }
    .hero .gold-line { margin:22px 0 0; width:86px; }
    .hero .meta { justify-content:flex-start; flex-wrap:wrap; margin-top:20px; opacity:.88; }
    .hero .meta span { padding:7px 11px; border-radius:10px; background:rgba(255,255,255,.1); }
    .hero-quote { margin-top:28px; padding-left:16px; border-left:2px solid var(--accent); color:rgba(255,255,255,.82);
      font-family:'Noto Serif SC',serif; font-size:15px; line-height:1.8; }
    .float-symbol { position:absolute; z-index:2; font-size:24px; filter:drop-shadow(0 8px 12px rgba(0,0,0,.2));
      animation:float 6s ease-in-out infinite; pointer-events:none; }
    .float-symbol.one { left:7%; top:18%; }.float-symbol.two { right:8%; top:26%; animation-delay:-2s; }
    .float-symbol.three { left:12%; bottom:13%; animation-delay:-4s; }.float-symbol.four { right:13%; bottom:12%; animation-delay:-1s; }
    .scroll-cue { margin:34px auto 0; width:30px; height:48px; border:1px solid rgba(255,255,255,.45);
      border-radius:20px; position:relative; }
    .scroll-cue::after { content:""; position:absolute; top:9px; left:50%; width:4px; height:8px; border-radius:4px;
      background:#fff; transform:translateX(-50%); animation:scrollCue 1.8s ease-in-out infinite; }
    .nav-bar { top:0; border:0; background:rgba(255,255,255,.78); backdrop-filter:blur(18px);
      box-shadow:0 8px 30px rgba(44,62,107,.06); }
    .nav-inner { max-width:1050px; justify-content:center; }
    .nav-item { padding:16px 15px; transition:.25s ease; }
    .nav-item.active { background:color-mix(in srgb,var(--accent) 11%,transparent); }
    .content { max-width:1050px; padding:52px 22px 100px; }
    .section { position:relative; margin-bottom:28px; padding:34px; border-radius:28px;
      background:rgba(255,255,255,.82); border:1px solid rgba(255,255,255,.9);
      box-shadow:0 18px 55px rgba(44,62,107,.08); backdrop-filter:blur(12px); overflow:hidden; }
    .section::after { content:attr(data-no); position:absolute; right:20px; top:-28px; color:var(--primary);
      opacity:.035; font:bold 110px/1 'Noto Serif SC',serif; pointer-events:none; }
    .section-title { font-size:27px; }.section-title .icon { width:44px; height:44px; display:grid; place-items:center;
      border-radius:15px; background:color-mix(in srgb,var(--accent) 16%,white); box-shadow:0 8px 18px rgba(0,0,0,.06); }
    .section-line { width:66px; }
    .overview-strip { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:-26px auto 48px;
      position:relative; z-index:3; max-width:900px; }
    .overview-item { padding:18px; border-radius:18px; background:#fff; box-shadow:0 16px 40px rgba(44,62,107,.12);
      text-align:center; border:1px solid var(--border); }
    .overview-item strong { display:block; color:var(--primary); font:700 25px/1.2 'Noto Serif SC',serif; }
    .overview-item span { color:var(--text-light); font-size:12px; }
    .info-item,.card { border:1px solid color-mix(in srgb,var(--border) 80%,transparent); box-shadow:0 10px 28px rgba(44,62,107,.07);
      transition:transform .3s ease,box-shadow .3s ease,border-color .3s ease; }
    .info-item:hover,.card:hover { transform:translateY(-4px); box-shadow:0 18px 38px rgba(44,62,107,.12); border-color:var(--accent-light); }
    .timeline::before { width:3px; background:linear-gradient(var(--accent),var(--primary-light)); }
    .timeline-item { margin:0 0 16px; padding:18px 20px; border-radius:16px; background:color-mix(in srgb,var(--bg) 72%,white);
      transition:transform .25s ease; }.timeline-item:hover { transform:translateX(5px); }
    .timeline-item::before { top:25px; box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 20%,white); }
    .gallery-grid { grid-template-columns:repeat(12,1fr); grid-auto-rows:70px; gap:12px; }
    .gallery-item { grid-column:span 4; grid-row:span 3; aspect-ratio:auto; border-radius:18px;
      box-shadow:0 14px 32px rgba(44,62,107,.12); }
    .gallery-item:nth-child(5n+1) { grid-column:span 8; grid-row:span 5; }
    .gallery-item:nth-child(5n+4) { grid-column:span 5; grid-row:span 4; }
    .gallery-item img { transition:transform .6s cubic-bezier(.2,.8,.2,1),filter .4s; }
    .gallery-item:hover img { transform:scale(1.08); filter:saturate(1.08); }
    .lightbox { backdrop-filter:blur(16px); }.lightbox img { box-shadow:0 30px 90px rgba(0,0,0,.5); }
    .fab button { background:linear-gradient(135deg,var(--primary),var(--primary-light)); padding:15px 25px;
      box-shadow:0 10px 30px color-mix(in srgb,var(--primary) 32%,transparent); }
    @keyframes orbit { to { transform:rotate(360deg); } }
    @keyframes float { 0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-16px) rotate(4deg)} }
    @keyframes shine { 0%,55%{left:-260px}75%,100%{left:110%} }
    @keyframes scrollCue { 0%{opacity:0;transform:translate(-50%,0)}40%{opacity:1}100%{opacity:0;transform:translate(-50%,17px)} }
    @keyframes cardEntrance { from{opacity:0;transform:translateY(34px) scale(.96)}to{opacity:1;transform:none} }
    @media (max-width:768px) {
      .hero { min-height:760px; padding:42px 16px 58px; }
      .digital-card { grid-template-columns:1fr; gap:26px; text-align:center; padding:28px 20px; border-radius:27px; }
      .portrait-wrap { min-height:185px; }.hero .avatar { width:145px; height:145px; }.portrait-ring{width:178px;height:178px}
      .hero .gold-line { margin:18px auto 0; }.hero .meta { justify-content:center; }.hero-quote{text-align:left}
      .float-symbol.one,.float-symbol.three { left:3%; }.float-symbol.two,.float-symbol.four { right:3%; }
      .overview-strip { grid-template-columns:1fr 1fr; margin:-20px 10px 34px; }
      .content { padding:32px 12px 86px; }.section { padding:25px 18px; border-radius:22px; }

    .aurora .a3 { width:20vw;height:20vw;left:42%;top:-8%;background:radial-gradient(circle,var(--glow-a),transparent 68%);filter:blur(22px);animation:breath 8s ease-in-out infinite; }

  // ============================================

    function render() {

          <div class="nav-item" onclick="scrollTo2('sec-projects',this)"><span class="chapter-label"><b>02</b><i>◫</i>作品与项目</span></div>
          <div class="nav-item" onclick="scrollTo2('sec-skills',this)"><span class="chapter-label"><b>03</b><i>✺</i>技能与荣誉</span></div>

          下载PPT

    // Intersection observer for fade-in
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.classList.add('visible');
          const nav = document.querySelector(`.nav-item[onclick*="${e.target.id}"]`);
          if (nav && Date.now() >= navLockUntil) {
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            nav.classList.add('active');
          }
        }
      });
    }, { rootMargin: '-25% 0px -55% 0px', threshold: 0 });
    document.querySelectorAll('.fade-in, #sec-hero').forEach(el => observer.observe(el));

    const updateMotion = () => {
      const max = document.documentElement.scrollHeight - innerHeight;
      const ratio = max > 0 ? scrollY / max : 0;
      const progress = document.getElementById('scroll-progress');
      if (progress) progress.style.width = `${ratio * 100}%`;
      const card = document.getElementById('digital-card');
      if (card && scrollY < innerHeight) card.style.transform = `translateY(${scrollY * .08}px) scale(${1 - scrollY * .00008})`;
      if (scrollY + innerHeight >= document.documentElement.scrollHeight - 4) {
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.querySelector('.nav-item:last-child')?.classList.add('active');
      }
    };
    addEventListener('scroll', updateMotion, { passive:true });
    updateMotion();

    const tiltCard = document.getElementById('digital-card');
    if (tiltCard && matchMedia('(pointer:fine)').matches && !matchMedia('(prefers-reduced-motion:reduce)').matches) {
      tiltCard.addEventListener('pointermove', (event) => {
        const rect = tiltCard.getBoundingClientRect();
        const x = (event.clientX - rect.left) / rect.width - .5;
        const y = (event.clientY - rect.top) / rect.height - .5;
        tiltCard.style.transform = `perspective(1200px) rotateY(${x * 4}deg) rotateX(${-y * 4}deg) translateY(${scrollY * .04}px)`;
      });
      tiltCard.addEventListener('pointerleave', () => { tiltCard.style.transform = ''; });
    }
  }

  // ============================================
  // Section Renderers
  // ============================================
  function renderTimeline(items, photos = [], birthday = null) {
    if (!items || !items.length) return '<div class="empty">暂无成长记录</div>';
    return '<div class="timeline-portfolio">' + items.map((item, index) => `
      <article class="milestone${index === items.length - 1 ? ' is-highlight' : ''}">
        <div class="milestone-marker"><strong>${String(index + 1).padStart(2, '0')}</strong><span>${new Date(item.event_date).getFullYear() || ''}</span></div>
        <div class="milestone-story">
          <span class="milestone-age">${getAgeAtDate(birthday, item.event_date)}</span>
          <div class="timeline-title">${item.title || ''}</div>
          <div class="timeline-desc">${item.description || ''}</div>
        </div>
        ${photos[index] ? `<button class="milestone-evidence" onclick="showLightbox('${getPhotoUrl(photos[index].photo_url)}')"><img src="${getPhotoUrl(photos[index].photo_url)}" alt="${photos[index].caption || item.title || ''}" loading="lazy"></button>` : ''}
      </article>
    `).join('') + '</div>';
  }

  function renderCards(items, renderer) {
    if (!items || !items.length) return '<div class="empty">暂无记录</div>';
    return items.map(renderer).join('');
  }

  function renderGallery(photos) {
    if (!photos || !photos.length) return '<div class="empty">暂无照片</div>';
    return '<div class="gallery-grid">' + photos.map(p => `
      <div class="gallery-item" onclick="showLightbox('${getPhotoUrl(p.photo_url)}')">
        <img src="${getPhotoUrl(p.photo_url)}" alt="${p.caption || ''}" loading="lazy">
        ${p.caption ? `<div class="caption">${p.caption}</div>` : ''}
      </div>
    `).join('') + '</div>';
  }

  // ============================================
  // Helpers
  // ============================================
  function getPhotoUrl(path) {
    if (!path) return '';
    if (path.startsWith('http') || path.startsWith('data:')) return path;
    const { data } = db.storage.from('photos').getPublicUrl(path);
    return data?.publicUrl || '';
  }

  function renderProjectGallery(photos) {
    if (!photos || !photos.length) return '<div class="empty">暂无作品</div>';
    const [featured, ...rest] = photos;
    return `<div class="work-editorial">
      <article class="featured-work" onclick="showLightbox('${getPhotoUrl(featured.photo_url)}')">
        <img src="${getPhotoUrl(featured.photo_url)}" alt="${featured.caption || '精选成长作品'}" loading="lazy">

  function formatDate(d) {
    if (!d) return '';
    return new Date(d).toLocaleDateString('zh-CN');
  }

  function getAge(birthday) {
    if (!birthday) return null;
    const birth = new Date(birthday);
    if (Number.isNaN(birth.getTime())) return null;
    const today = new Date();
    let age = today.getFullYear() - birth.getFullYear();
    const beforeBirthday = today.getMonth() < birth.getMonth() || (today.getMonth() === birth.getMonth() && today.getDate() < birth.getDate());
    if (beforeBirthday) age -= 1;
    return Math.max(0, age);
  }

  function getGrowthStage(age) {
    if (age === null) return '成长探索期';
    if (age <= 3) return '启蒙发现期';
    if (age <= 6) return '好奇探索期';
    if (age <= 9) return '兴趣拓展期';
    if (age <= 12) return '自主进阶期';
    return '青春成长阶段';
  }

  function getAgeAtDate(birthday, date) {
    if (!birthday || !date) return '成长里程碑';
    const birth = new Date(birthday);
    const eventDate = new Date(date);
    if (Number.isNaN(birth.getTime()) || Number.isNaN(eventDate.getTime())) return '成长里程碑';
    let age = eventDate.getFullYear() - birth.getFullYear();
    if (eventDate.getMonth() < birth.getMonth() || (eventDate.getMonth() === birth.getMonth() && eventDate.getDate() < birth.getDate())) age -= 1;
    return `${Math.max(0, age)}岁成长节点 · ${formatDate(date)}`;
  }

  function getGrowthKeywords(data) {
    const source = [
      ...(data.timeline || []).flatMap(item => [item.title, item.description]),
      ...(data.courses || []).flatMap(item => [item.course_name, item.performance]),
      ...(data.activities || []).flatMap(item => [item.activity_name, item.role, item.description]),
      ...(data.comments || []).map(item => item.comment)
    ].filter(Boolean).join(' ');
    const rules = [
      [/表达|介绍|分享|语言|英语/, '自信表达'],
      [/合作|伙伴|小组|帮助/, '乐于合作'],
      [/创意|设计|想法|搭建|作品/, '创意探索'],
      [/观察|发现|自然|好奇/, '好奇观察'],
      [/专注|坚持|独立|完成/, '专注行动']
    ];
    const matched = rules.filter(([pattern]) => pattern.test(source)).map(([, label]) => label);
    return [...matched, '成长进行时', '闪光日常'].slice(0, 3);
  }

      slide.addShape(pptx.ShapeType.ellipse, { x: -1.5, y: 5, w: 4, h: 4, fill: { color: sc.primary, transparency: 85 } });
      
      slide.addText('成长手册', { x: 1, y: 1.5, w: 11, fontSize: 48, fontFace: 'Microsoft YaHei', color: 'FFFFFF', bold: true, align: 'center' });

      // ===== Slide 2: Basic Info =====

      // ===== Slide 6: Activities =====
